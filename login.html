<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WhatsCart Console</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #25D366;
      --primary-hover: #1fba58;
      --bg-main: #0B0E11;
      --bg-card: #17202B;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --font-family-title: 'Outfit', sans-serif;
      --font-family-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-family-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Background glow */
    .glow-bg {
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(37, 211, 102, 0.06) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: 1;
    }

    .login-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      z-index: 10;
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background-color: var(--primary-color);
      color: #0c2312;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }

    .brand-info h2 {
      font-family: var(--font-family-title);
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #FFF 30%, var(--primary-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-info span {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header h1 {
      font-family: var(--font-family-title);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .form-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input-wrapper i {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-control {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 14px 14px 40px;
      color: var(--text-main);
      font-family: var(--font-family-body);
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary-color);
      background-color: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 10px rgba(37, 211, 102, 0.15);
    }

    .btn-login {
      width: 100%;
      background-color: var(--primary-color);
      color: #0c2312;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-family: var(--font-family-body);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.15);
      transition: all 0.3s ease;
      margin-top: 8px;
    }

    .btn-login:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.25);
    }

    .error-alert {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #F87171;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    /* Quick login shortcuts */
    .quick-roles {
      margin-top: 32px;
      border-top: 1px solid var(--border-color);
      padding-top: 24px;
    }

    .quick-roles h3 {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      text-align: center;
    }

    .role-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .role-btn {
      width: 100%;
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-main);
      font-family: var(--font-family-body);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      text-align: left;
    }

    .role-btn:hover {
      background-color: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .role-btn img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
    }

    .role-badge {
      font-size: 10px;
      font-weight: 700;
      background-color: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: auto;
      text-transform: uppercase;
    }

    .role-badge.owner {
      background-color: rgba(37, 211, 102, 0.1);
      color: var(--primary-color);
    }

    .role-badge.agent {
      background-color: rgba(59, 130, 246, 0.1);
      color: #60A5FA;
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>

  <div class="login-card">
    <div class="brand">
      <div style="width: 40px; height: 40px; overflow: hidden; display: flex; align-items: flex-start; justify-content: center; flex-shrink: 0; margin-right: 12px; border-radius: 8px; background-color: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05);">
        <img src="images/logo.png" alt="Plan D Media" style="width: 100%; height: auto; transform: scale(1.6); transform-origin: top center; margin-top: 2px;">
      </div>
      <div class="brand-info">
        <h2>Plan D Media</h2>
        <span>B2C Console</span>
      </div>
    </div>

    <div class="login-header">
      <h1>Console Sign In</h1>
      <p>Enter your B2C console credentials to manage conversations.</p>
    </div>

    <div class="error-alert" id="login-error">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span id="error-message">Invalid username or password</span>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label>Username</label>
        <div class="form-input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" class="form-control" placeholder="Enter username..." required id="login-username">
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="form-input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" class="form-control" placeholder="••••••••" required id="login-password">
        </div>
      </div>

      <button type="submit" class="btn-login" id="btn-submit">Sign In</button>
    </form>

    <!-- Quick login links -->
    <div class="quick-roles">
      <h3>Quick Presenter Logins</h3>
      <div class="role-buttons">
        <button class="role-btn" data-username="sarah" data-password="admin">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Sarah">
          <span>Sarah Jenkins (Shop Owner)</span>
          <span class="role-badge owner">Owner</span>
        </button>
        <button class="role-btn" data-username="john" data-password="agent">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&auto=format&fit=crop&q=80" alt="John">
          <span>John Support (Support Agent)</span>
          <span class="role-badge agent">Agent</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Form and input selectors
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('btn-submit');
    const errorAlert = document.getElementById('login-error');
    const errorMessage = document.getElementById('error-message');

    // Handle credential login
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';
      errorAlert.style.display = 'none';

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // Save session to localStorage
          localStorage.setItem('whatscart_user', JSON.stringify(data.user));
          window.location.href = '/index.html';
        } else {
          showError(data.error || 'Authentication failed');
        }
      } catch (err) {
        console.error('Login error', err);
        showError('Network error connecting to authentication server.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    // Handle quick login shortcuts
    document.querySelectorAll('.role-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const username = btn.getAttribute('data-username');
        const password = btn.getAttribute('data-password');
        
        document.getElementById('login-username').value = username;
        document.getElementById('login-password').value = password;
        
        // Auto trigger submit
        form.dispatchEvent(new Event('submit'));
      });
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorAlert.style.display = 'flex';
    }
  </script>
</body>
</html>
